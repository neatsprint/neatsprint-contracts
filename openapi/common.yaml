openapi: 3.1.0
info:
  title: NeatSprint Common Components
  version: 0.1.0
  description: |
    Shared schemas, parameters and responses used by every NeatSprint service.
    This document contains no paths; it is referenced and copied by service contracts.
  contact:
    name: NeatSprint
    url: https://github.com/neatsprint
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: http://localhost:8000/api/v1
    description: Local gateway

paths: {}

components:
  schemas:
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          examples: [title]
        code:
          type: string
          examples: [too_long]
        message:
          type: string
          examples: ["Max 240 characters."]

    ProblemDetail:
      type: object
      description: RFC 7807 problem details plus a stable machine-readable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://docs.neatsprint.com/errors/permission_denied"]
        title:
          type: string
          examples: [Permission denied]
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          examples: [permission_denied]
        detail:
          type: [string, "null"]
        instance:
          type: [string, "null"]
        request_id:
          type: [string, "null"]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
        trace_id:
          type: [string, "null"]
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
        next_cursor:
          type: [string, "null"]

    ErrorResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ProblemDetail"
        meta:
          $ref: "#/components/schemas/Meta"

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string

  headers:
    RequestId:
      description: Correlation id echoed from the request or generated by the platform.
      schema:
        type: string
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Authenticated but not permitted. Foreign-tenant resources return 404 instead.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found, or not visible to the caller's tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: State conflict.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ValidationFailed:
      description: Semantic or field validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    RateLimited:
      description: Rate limit or quota exceeded.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 access token issued by neatsprint-iam.

security:
  - bearerAuth: []
